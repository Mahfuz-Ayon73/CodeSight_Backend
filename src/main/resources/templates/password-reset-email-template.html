<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Hello, <span th:text="${name}">User</span>!</h2>
    <p>We received a request to reset your CodeSight password. Click the button below to set a new password. This link expires in 15 minutes.</p>
    <a th:href="${resetUrl}" style="background-color: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">Reset Password</a>
    <p style="margin-top: 20px; color: #888; font-size: 13px;">If you did not request a password reset, you can safely ignore this email.</p>
</body>
</html>
